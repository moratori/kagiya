      - {name: DHE-RSA-AES256-GCM-SHA384, standard: TLS_DHE_RSA_WITH_AES_256_GCM_SHA384, id: "0x00,0x9F", protocol: TLSv1.2, kx: DH, au: RSA, enc: "AESGCM(256)", mac: AEAD, strength: 256, level: 5, default: true, keywords: "AES AES256 AESGCM ALL DH DHE EDH FIPS HIGH TLSv1.2 aRSA kDHE kEDH"}
