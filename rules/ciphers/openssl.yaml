# OpenSSL の暗号スイートの対応表。設定に書かれた暗号文字列（HIGH:!aNULL など）を、実際のスイートの一覧に展開するのに使う。
#
# どの語がどのスイートを指すか、スイートの並び、既定で有効なもの、セキュリティレベルごとに使えるものは、
# 上流の版だけでは決まらず、ディストリのパッケージ版ごとに違う。そのため、パッケージ版ごとに実物で採取した値を持つ。
# 中身が同じだった版は1つの表にまとめ、builds に並べている。
#
# 採取方法: 各イメージにディストリのリポジトリから openssl を導入し、openssl 自身に報告させた（openssl ciphers -V）。
#           システムの openssl.cnf の影響を除くため、空の設定ファイルを読ませている。
#   suites      : TLS 1.2 以下のスイート。並びはライブラリ内部の並び（語で足したときにこの順で入る）。
#     strength  : @STRENGTH の並べ替えを再現する値。表示の鍵長と違うことがある（並び順を決める以外の意味はない）。
#     level     : そのスイートが使える最大のセキュリティレベル。ないものは、アプリ側の追加の設定（PSK や SRP）がないと使えない。
#     default   : 既定（DEFAULT）に含まれる。
#     keywords  : このスイートを指す語。
#   tls13       : TLS 1.3 のスイート。暗号文字列の対象外で、別の設定（Ciphersuites）で決まる。
#   standard_names : 暗号文字列に標準名（TLS_ECDHE_RSA_WITH_...）を書けるか。
#   default_level  : 指定がないときのセキュリティレベル（使えるスイートが同じになる最小のレベル）。
#   profile_system : 「PROFILE=SYSTEM」と書かれたときにライブラリが読むファイル（RHEL 系のみ）。
#
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
cipher_tables:
  - library: openssl
    upstream: "1.1.1k"
    builds:
      - package: openssl-libs
        version: "1.1.1k-18.el8_6"
        source:
          image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
          os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
          note: "package installed from the distribution repository in the image; values reported by "openssl ciphers" with an empty openssl.cnf"
    standard_names: false
    security_levels: true
    default_level: 2
    profile_system: "/etc/crypto-policies/back-ends/openssl.config"
    tls13:
      - {name: TLS_AES_256_GCM_SHA384, standard: TLS_AES_256_GCM_SHA384, id: "0x13,0x02", protocol: TLSv1.3, kx: any, au: any, enc: "AESGCM(256)", mac: AEAD, level: 5, default: true}
      - {name: TLS_CHACHA20_POLY1305_SHA256, standard: TLS_CHACHA20_POLY1305_SHA256, id: "0x13,0x03", protocol: TLSv1.3, kx: any, au: any, enc: "CHACHA20/POLY1305(256)", mac: AEAD, level: 5, default: true}
      - {name: TLS_AES_128_GCM_SHA256, standard: TLS_AES_128_GCM_SHA256, id: "0x13,0x01", protocol: TLSv1.3, kx: any, au: any, enc: "AESGCM(128)", mac: AEAD, level: 3, default: true}
