# OpenSSL の鍵交換のグループ（TLS の supported_groups。楕円曲線、有限体 DH、耐量子のハイブリッドなど）の対応表。
# サーバーが受け入れるグループを、設定の記載（なければシステムの設定、それもなければライブラリの既定）から求めるのに使う。
#
# その版が知っている名前、既定で受け入れるグループ、指定の書き方の解釈は、版によって違う。パッケージ版ごとに実物で採取した値を持つ。
#   syntax          : 指定の書き方。basic = 「:」区切りだけ。名前は大文字小文字を区別し、同じグループを2回書くと拒否される。
#                     extended = 「/」での区切り、接頭辞（? * -）、DEFAULT が使える。名前は大文字小文字を区別しない。
#   measured_levels : セキュリティレベルごとの測定ができた最大のレベル。
#   groups          : グループ。既定で受け入れるもの（default）を、既定の並びの順で先に置く。
#     aliases       : 同じグループを指す別の名前（その版が受け付けるもの）。
#     tls13 / tls12 : そのプロトコルの鍵交換で使えるか。
#     level         : そのグループを受け入れる最大のセキュリティレベル（測定できた範囲で）。
#
# 採取方法: 各イメージにディストリのリポジトリから openssl を導入し、同じコンテナ内で openssl s_server を起動して、
#           グループを1つずつ指定した openssl s_client で接続できるかを確かめた（空の openssl.cnf を読ませている）。
#           OpenSSL 1.0.2（Ubuntu 16.04）は、この方法で測れないため載せていない。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
group_tables:
  - library: openssl
    upstream: "1.1.1k"
    builds:
      - package: openssl-libs
        version: "1.1.1k-18.el8_6"
        source:
          image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
          os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
          note: "package installed from the distribution repository in the image; openssl s_server started in the container with an empty openssl.cnf and probed with openssl s_client, one group at a time"
    syntax: basic
    measured_levels: 2
    groups:
      - {name: X25519, tls13: true, tls12: true, level: 2, default: true}
      - {name: X448, tls13: true, tls12: true, level: 2, default: true}
      - {name: P-256, aliases: "prime256v1", tls13: true, tls12: true, level: 2, default: true}
