# stunnel（TLS に対応していないプログラムの通信を TLS で包む中継）。
app:
  id: stunnel
  # Debian 系は /usr/bin/stunnel4 が本体で、/usr/bin/stunnel はそこへのリンク
  binaries: ["/usr/bin/stunnel", "/usr/bin/stunnel4"]
  version_pattern: 'stunnel (\d+\.\d+[a-z0-9.]*) on '
  packages: ["stunnel", "stunnel4"]
  grammar: stunnel
  # 設定は /etc/stunnel/ の下の *.conf。それぞれが 1 つの起動単位になる（収集側で、このディレクトリの *.conf をすべて読む）。
  # Debian 系では名前が決まっていないので、パターンでも探す
  config_files: ["/etc/stunnel/stunnel.conf", "/etc/stunnel/*.conf"]
  units: ["stunnel.service"]
  direction: inbound
  directives:
    - { name: accept, parameter: tls.listen, type: listen, multi: true }
    - { name: ciphers, parameter: tls.ciphers, type: cipher-string }
    - { name: ciphersuites, parameter: tls.ciphersuites-tls13, type: colon-list }
    - { name: curves, parameter: tls.groups, type: colon-list }
    - { name: sslVersion, parameter: tls.protocols, type: words }
    - { name: sslVersionMin, parameter: tls.min-protocol, type: words }
    - { name: sslVersionMax, parameter: tls.max-protocol, type: words }
    - { name: cert, parameter: tls.certificate, type: path }
    - { name: key, parameter: tls.private-key, type: path }
    - { name: CAfile, parameter: tls.trusted-certificates, type: path }
  sources:
    - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
      os: "Red Hat Enterprise Linux 9.9 (Plow)"
      note: "stunnel 5.71-2.el9。/usr/bin/stunnel に 'stunnel 5.71 on aarch64-redhat-linux-gnu'。ユニットは stunnel.service（引数なしで /etc/stunnel/stunnel.conf を読む）と stunnel@.service（/etc/stunnel/%i.conf）"
    - image: "ubuntu@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6"
      os: "Ubuntu 16.04.7 LTS"
      note: "stunnel4 3:5.30-1ubuntu0.1。本体は /usr/bin/stunnel4 で、'stunnel 5.30 on aarch64-unknown-linux-gnu'。systemd のユニットはない"
    - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
      os: "Ubuntu 24.04.5 LTS"
      note: "stunnel4 3:5.72-1build2。本体は /usr/bin/stunnel4。ユニットは stunnel@.service（/etc/stunnel/%i.conf）と stunnel.target"
