# Apache HTTP Server。
# 本体（httpd / apache2）は暗号ライブラリにリンクしていない。TLS は実行時に読み込まれるモジュール mod_ssl.so が担い、
# そのモジュールが libssl / libcrypto にリンクしている。
app:
  id: httpd
  binaries: ["/usr/sbin/httpd", "/usr/sbin/apache2"]
  modules: ["/usr/lib64/httpd/modules/mod_ssl.so", "/usr/lib/apache2/modules/mod_ssl.so"]
  version_pattern: 'Apache/(\d+\.\d+\.\d+)'
  packages: ["httpd-core", "httpd", "apache2-bin"]
  sources:
    - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "/usr/sbin/httpd に 'Apache/2.4.37 (Red Hat Enterprise Linux)'。/usr/lib64/httpd/modules/mod_ssl.so が libssl.so.1.1 にリンク。パッケージは httpd と mod_ssl"
    - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
      os: "Red Hat Enterprise Linux 9.9 (Plow)"
      note: "/usr/sbin/httpd に 'Apache/2.4.62 (Red Hat Enterprise Linux)'。本体のパッケージは httpd-core"
    - image: "ubuntu@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6"
      os: "Ubuntu 16.04.7 LTS"
      note: "/usr/sbin/apache2 に 'Apache/2.4.18 (Ubuntu)'。/usr/lib/apache2/modules/mod_ssl.so が libssl.so.1.0.0 にリンク。パッケージは apache2-bin"
    - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
      os: "Ubuntu 24.04.5 LTS"
      note: "/usr/sbin/apache2 に 'Apache/2.4.58 (Ubuntu)'。パッケージは apache2-bin"
