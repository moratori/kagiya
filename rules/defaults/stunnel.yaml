# stunnel の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers            : ciphers の記載がないときの暗号文字列。stunnel のバイナリに埋め込まれた既定。
#                            「@system」は、埋め込まれた既定がなく、OpenSSL のシステム既定のままになることを表す。
#   tls.ciphersuites-tls13 : ciphersuites の記載がないときの TLS 1.3 のスイート。stunnel のバイナリに埋め込まれた既定で、
#                            システムの openssl.cnf の指定より優先される。
#   tls.dhe-without-params : DH パラメータの指定がないときに DHE のスイートを使えるか（builtin = 組み込みのパラメータで使える）。
#   tls.groups             : curves の記載がないときの鍵交換のグループ。stunnel のバイナリに埋め込まれた既定で、
#                            システムの openssl.cnf やライブラリの既定より優先される（耐量子のハイブリッドを含まない）。
#
# 採取方法: 各イメージにディストリのリポジトリから stunnel を導入し、実際に起動して、同じコンテナ内からのハンドシェイク
#           （openssl s_client）で受け入れるスイートを数え上げた。その結果が「この暗号文字列を、その版の OpenSSL で
#           展開したもの」と完全に一致することを確かめている。既定の文字列は、バイナリに埋め込まれた文字列から採った。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: stunnel
    package: stunnel
    version: "5.71-2.el8_10"
    source:
      image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "server started in the container; accepted suites enumerated by handshakes (openssl s_client); default strings taken from the binary"
    values:
      tls.ciphers: "PROFILE=SYSTEM"
      tls.ciphersuites-tls13: "TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256"
      tls.dhe-without-params: "builtin"
      tls.groups: "X25519:P-256:X448:P-521:P-384"
