# Postfix（smtpd）の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.security-level         : Postfix が OpenSSL に設定するセキュリティレベル。どの版も 0 にする（システムの openssl.cnf の指定は効かない）。
#                                セキュリティレベルの仕組みがない OpenSSL（1.0.2）の版には、この項目はない。
#   tls.ciphers                : 暗号の等級の指定がないときの暗号文字列（等級 medium の tls_medium_cipherlist）。
#   tls.cipher-grade / tls.mandatory-cipher-grade : 等級の既定（smtpd_tls_ciphers、smtpd_tls_mandatory_ciphers）。
#   tls.cipherlist.<等級>      : 等級（high / medium / low / export / null）に対応する暗号文字列（tls_<等級>_cipherlist）。
#                                新しい版では low と export は空で、この表にはない。
#   tls.groups                 : グループの指定がないときの鍵交換のグループ（tls_eecdh_auto_curves と tls_ffdhe_auto_groups）。
#                                システムの openssl.cnf やライブラリの既定より優先される（耐量子のハイブリッドを含まない）。
#   tls.eecdh-curves           : tls_eecdh_auto_curves の既定。
#   tls.ffdhe-groups           : tls_ffdhe_auto_groups の既定（この項目を持つ版だけ）。
#   tls.eecdh-grade-default    : smtpd_tls_eecdh_grade（古い書き方）の既定。
#   tls.eecdh-grade            : smtpd_tls_eecdh_grade の strong / ultra の指定が効くか（honored / ignored）。
#   tls.eecdh-strong-curve / tls.eecdh-ultra-curve : その指定が効く版での、等級に対応する曲線。
#   tls.dhe-without-params     : DH パラメータの指定がないときに DHE のスイートを使えるか（builtin = 組み込みのパラメータで使える）。
#
# 採取方法: 各イメージにディストリのリポジトリから postfix を導入し、既定値は Postfix 自身の出力（postconf -d）から採った。
#           挙動は、実際に起動して、同じコンテナ内からのハンドシェイク（openssl s_client、STARTTLS）で受け入れるスイートと
#           グループを数え上げ、「等級の暗号文字列に除外の指定を足したものを、その版の OpenSSL でレベル 0 で展開したもの」と
#           完全に一致することを確かめている（8 イメージ × 12 場面）。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: postfix
    package: postfix
    version: "3.5.8-8.el8_10"
    source:
      image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "defaults from postconf -d; server started in the container; accepted suites and groups enumerated by handshakes (openssl s_client -starttls smtp)"
    values:
      tls.security-level: "0"
      tls.ciphers: "aNULL:-aNULL:HIGH:MEDIUM:+RC4:@STRENGTH"
      tls.cipher-grade: "medium"
      tls.mandatory-cipher-grade: "medium"
      tls.cipherlist.high: "aNULL:-aNULL:HIGH:@STRENGTH"
      tls.cipherlist.medium: "aNULL:-aNULL:HIGH:MEDIUM:+RC4:@STRENGTH"
      tls.cipherlist.low: "aNULL:-aNULL:HIGH:MEDIUM:LOW:+RC4:@STRENGTH"
      tls.cipherlist.export: "aNULL:-aNULL:HIGH:MEDIUM:LOW:EXPORT:+RC4:@STRENGTH"
      tls.cipherlist.null: "eNULL:!aNULL"
      tls.groups: "X25519:X448:prime256v1:secp521r1:secp384r1"
      tls.eecdh-curves: "X25519:X448:prime256v1:secp521r1:secp384r1"
      tls.eecdh-grade-default: "auto"
      tls.eecdh-grade: "honored"
      tls.eecdh-strong-curve: "prime256v1"
      tls.eecdh-ultra-curve: "secp384r1"
      tls.dhe-without-params: "builtin"
