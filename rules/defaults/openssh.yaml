# OpenSSH サーバー（sshd）の既定値。設定に記載のない項目の実効値を求めるのに使う。
#
# 既定値は上流の版だけでは決まらず、ディストリのパッケージ版ごとに違う（同じ 9.9p1 でも RHEL 9.9 と RHEL 10.3 で異なる）。
# そのため、パッケージ版ごとに、実物で採取した値を持つ。該当するパッケージ版がここになければ、既定値は「不明」として扱う。
#
# 採取方法: 各イメージに openssh-server を導入し、空の設定ファイルを指定して sshd 自身に報告させた
