# Apache httpd（mod_ssl）の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers            : SSLCipherSuite の記載がないときの暗号文字列。
#                            Debian 系はパッケージの設定ファイルが必ず SSLCipherSuite を書いているため、組み込みの既定は
#                            実測できていない（その版の表には載せていない）。
#   tls.dhe-without-params : DH パラメータの指定がないときに DHE のスイートを使えるか（builtin = 組み込みのパラメータで使える）。
#
# 採取方法: 各イメージにディストリのリポジトリから httpd（mod_ssl）を導入し、証明書だけを指定した VirtualHost を実際に起動して、
#           同じコンテナ内からのハンドシェイク（openssl s_client）で受け入れるスイートを数え上げた。
#           その結果が「この暗号文字列を、その版の OpenSSL で展開したもの」と完全に一致することを確かめている。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: httpd
    package: httpd
    version: "2.4.37-65.module+el8.10.0+25092+6f3ea0dd.13"
    source:
      image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "server started in the container; accepted suites enumerated by handshakes (openssl s_client)"
    values:
      tls.ciphers: "DEFAULT"
      tls.dhe-without-params: "builtin"
  - app: httpd
    package: httpd-core
    version: "2.4.62-13.el9_8.9"
    source:
      image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
      os: "Red Hat Enterprise Linux 9.9 (Plow)"
      note: "server started in the container; accepted suites enumerated by handshakes (openssl s_client)"
    values:
