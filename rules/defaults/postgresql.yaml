# PostgreSQL の既定値。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers            : ssl_ciphers の記載がないときの暗号文字列（サーバー自身が答える既定値。pg_settings の boot_val）。
#   tls.groups             : ssl_ecdh_curve の記載がないときの鍵交換のグループ（既定は 1 つだけ）。TLS 1.3 でもこのグループだけになり、
#                            システムの openssl.cnf やライブラリの既定には従わない（耐量子のハイブリッドを含まない）。
#   tls.dhe-without-params : ssl_dh_params_file の指定がないときに DHE のスイートを使えるか（builtin = 組み込みのパラメータで使える）。
#
# 採取方法: 各イメージにディストリのリポジトリから PostgreSQL を導入し、実際に起動して、既定値はサーバー自身の答え（pg_settings）から採った。
#           受け入れるスイートとグループは、同じコンテナ内からのハンドシェイク（openssl s_client -starttls postgres）で数え上げ、
#           「この暗号文字列を、その版の OpenSSL で展開したもの」と完全に一致することを確かめている。
#           RHEL 系は、UBI のリポジトリに PostgreSQL のサーバーがないため、AlmaLinux の公式イメージで測った（出典に記録）。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: postgresql
    package: postgresql-server
    version: "10.23-4.module_el8.9.0+3736+952d0ed7.alma.1"
    source:
      image: "almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b"
      os: "AlmaLinux 8.10 (Cerulean Leopard)"
      note: "defaults from pg_settings (boot_val) of the running server; accepted suites and groups enumerated by handshakes (openssl s_client -starttls postgres)"
    values:
      tls.ciphers: "HIGH:MEDIUM:+3DES:!aNULL"
      tls.groups: "prime256v1"
      tls.dhe-without-params: "builtin"
  - app: postgresql
    package: postgresql-server
