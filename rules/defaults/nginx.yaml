# nginx の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers            : ssl_ciphers の記載がないときの暗号文字列。
#   tls.dhe-without-params : ssl_dhparam の記載がないときに DHE（一時的な DH 鍵交換）のスイートを使えるか。
#                            builtin = 組み込みのパラメータで使える / disabled = 使えない。
#
# 採取方法: 各イメージにディストリのリポジトリから nginx を導入し、証明書だけを指定した server を実際に起動して、
#           同じコンテナ内からのハンドシェイク（openssl s_client）で受け入れるスイートを数え上げた。
#           その結果が「この暗号文字列を、その版の OpenSSL で展開したもの」と完全に一致することを確かめている。
#           既定の暗号文字列は、nginx のバイナリに埋め込まれた文字列とも一致する。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: nginx
    package: nginx
    version: "1.14.1-9.module+el8.0.0+4108+af250afe"
    source:
      image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      method: enumerated-by-handshake
      verified-by-handshake: true
      items:
        tls.ciphers: { method: read-from-distributed-files, verified-by-handshake: true }
      note: "server started in the container; accepted suites enumerated by handshakes (openssl s_client)"
    values:
      tls.ciphers: "HIGH:!aNULL:!MD5"
      tls.dhe-without-params: "disabled"
