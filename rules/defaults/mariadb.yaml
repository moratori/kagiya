# MariaDB の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers             : ssl_cipher の記載がないときの暗号文字列。「@system」は、MariaDB が何も設定せず、OpenSSL のシステム既定のままになることを表す。
#   tls.without-certificate : 証明書の指定がないときの TLS。disabled = TLS は無効 / auto-rsa = 起動のたびに自分で用意した証明書（RSA）で有効。
#   tls.dhe-without-params  : DH パラメータの指定がなくても DHE のスイートを使えるか（builtin = 組み込みのパラメータで使える）。
#
# 鍵交換のグループと TLS 1.3 のスイートは、MariaDB 自身の既定を持たない（システムの openssl.cnf、なければライブラリの既定に従う）。
#
# 採取方法: 各イメージにディストリのリポジトリから導入し、実際に起動して、同じコンテナ内からのハンドシェイクで受け入れるスイートと
#           グループを数え上げ、予測と完全に一致することを確かめている。RHEL 系は AlmaLinux の公式イメージで測った（出典に記録）。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: mariadb
    package: mariadb-server
    version: "10.3.39-2.module_el8.10.0+4093+5130acef"
    source:
      image: "almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b"
      os: "AlmaLinux 8.10 (Cerulean Leopard)"
      note: "server started in the container; variables from the running server; accepted suites and groups enumerated by handshakes (openssl s_client through a relay that performs the MySQL pre-TLS exchange)"
    values:
      tls.ciphers: "@system"
      tls.without-certificate: "disabled"
      tls.dhe-without-params: "builtin"
