# MySQL の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers             : ssl_cipher の記載がないときの暗号文字列。MySQL が内蔵する既定の並びで、サーバーの変数には現れない。
#                             実行ファイルに埋め込まれた並びの組み合わせのうち、実測と一致するものを採った。
#   tls.cipher-suffix       : 設定に書かれた暗号文字列（ssl_cipher）の後ろに、MySQL が足す並び（拒否する暗号）。
#   tls.groups              : 鍵交換のグループ。MySQL が自分で決める（システムの openssl.cnf やライブラリの既定には従わず、X25519 も耐量子のハイブリッドも含まない）。
#   tls.without-certificate : 証明書の指定がないときの TLS。auto-rsa = データディレクトリに自分で用意した証明書（RSA）で有効。
#   tls.dhe-without-params  : DH パラメータの指定がなくても DHE のスイートを使えるか。
#
# TLS 1.3 のスイートは、tls_ciphersuites の指定がなければ、システムの openssl.cnf、なければライブラリの既定に従う。
#
# 採取方法: 各イメージにディストリのリポジトリから導入し、実際に起動して、同じコンテナ内からのハンドシェイクで受け入れるスイートと
#           グループを数え上げ、予測と完全に一致することを確かめている。RHEL 系は AlmaLinux の公式イメージで測った（出典に記録）。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
