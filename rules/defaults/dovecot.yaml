# Dovecot の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers            : ssl_cipher_list の記載がないときの暗号文字列（Dovecot 自身の既定。doveconf -d）。
#                            RHEL 系は、配られる設定ファイル（conf.d/10-ssl.conf）が PROFILE=SYSTEM を指定している（これは設定の記載として読む）。
#   tls.dhe-without-params : DH パラメータの指定がないときに DHE のスイートを使えるか。2.3 以降は使えない（disabled）。
#                            2.2 は、自分で生成したパラメータで使える（builtin）。
#   tls.profile-in-chroot  : 暗号文字列の「PROFILE=SYSTEM」（RHEL 系の配る設定）が、接続を受けるプロセスの chroot（既定で有効）の中で
#                            どう働くか。library-default = 暗号ポリシーのファイルを読めず、ライブラリの既定（DEFAULT）になる。
#                            chroot を外した設定では、暗号ポリシーどおりになる（どちらも実測）。
#   tls.settings           : 証明書などの設定項目の名前の系統（legacy = ssl_cert など / v24 = ssl_server_cert_file など）。
#
# 鍵交換のグループと TLS 1.3 のスイートは、Dovecot 自身の既定を持たない（ssl_curve_list、ssl_cipher_suites の指定がなければ、
# システムの openssl.cnf、なければライブラリの既定に従う）。
#
# 採取方法: 各イメージにディストリのリポジトリから dovecot を導入し、既定値は Dovecot 自身の出力（doveconf -d）から採った。
#           挙動は、実際に起動して、同じコンテナ内からのハンドシェイク（openssl s_client。imaps と pop3s）で受け入れるスイートと
#           グループを数え上げ、予測と完全に一致することを確かめている。RHEL 系は AlmaLinux の公式イメージで測った（出典に記録）。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: dovecot
    package: dovecot
    version: "2.3.16-16.el8_10"
    source:
      image: "almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b"
      os: "AlmaLinux 8.10 (Cerulean Leopard)"
      note: "defaults from doveconf -d; server started in the container; accepted suites and groups enumerated by handshakes (openssl s_client, imaps and pop3s)"
    values:
      tls.ciphers: "ALL:!kRSA:!SRP:!kDHd:!DSS:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK:!RC4:!ADH:!LOW@STRENGTH"
      tls.dhe-without-params: "disabled"
      tls.settings: "legacy"
      tls.profile-in-chroot: "library-default"
