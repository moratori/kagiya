# HAProxy の既定値と、版によって違う挙動。設定に記載のない項目の実効値を求めるのに使う。
#
#   tls.ciphers               : 暗号の指定（ssl-default-bind-ciphers、bind の ciphers）がないときの暗号文字列。
#                               「@system」は、アプリが何も設定せず、OpenSSL のシステム既定（openssl.cnf の CipherString。
#                               なければライブラリの DEFAULT）のままになることを表す。
#   tls.dhe-without-params    : DH パラメータの指定（tune.ssl.default-dh-param、ssl-dh-param-file）がないときに DHE のスイートを使えるか。
#                               builtin = 組み込みのパラメータで使える / disabled = 使えない。
#   tls.certificate-selection : 1つの bind に、同じ名前で鍵の種類が違う証明書を複数指定したときの扱い。
#                               all = 接続に応じてどれも使われ得る / first = 最初の証明書だけが使われる。
#
# 採取方法: 各イメージにディストリのリポジトリから haproxy を導入し、実際に起動して、同じコンテナ内からのハンドシェイク
#           （openssl s_client、サーバー名つき）で受け入れるスイートを数え上げた。その結果が「この暗号文字列を、その版の
#           OpenSSL で展開したもの」と完全に一致することを確かめている。
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
defaults:
  - app: haproxy
    package: haproxy
    version: "1.8.27-5.el8_10.2"
    source:
      image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "server started in the container; accepted suites enumerated by handshakes (openssl s_client with a server name)"
    values:
      tls.ciphers: "@system"
      tls.dhe-without-params: "builtin"
      tls.certificate-selection: "all"
  - app: haproxy
    package: haproxy
    version: "2.8.14-3.el9_8.2"
    source:
      image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
