# 結果に記録するパッケージと、その役割。
# パッケージ管理データベース（rpm、dpkg）には数百〜数千のパッケージがあるため、
# 暗号ライブラリと、暗号の設定を持つソフトウェアだけを記録する（それ以外は件数だけ）。
#
# names は完全一致。末尾に * を付けると前方一致（共有ライブラリのパッケージ名は版を含むため。例: libssl3t64）。
# 各定義には出典（sources）が必須。パッケージ名は、下記イメージに該当ソフトウェアを導入して確認した。
packages:
  - role: crypto-library
    names: ["openssl", "openssl-libs", "libssl*", "gnutls", "libgnutls*", "libgcrypt", "libgcrypt*"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "openssl, openssl-libs, gnutls, libgcrypt"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "openssl, openssl-libs, gnutls, libgcrypt"
      - image: "ubuntu@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6"
        os: "Ubuntu 16.04.7 LTS"
        note: "openssl, libssl1.0.0, libgnutls30, libgcrypt20"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "openssl, libssl3t64, libgnutls30t64, libgcrypt20"

  - role: ssh
    names: ["openssh", "openssh-server", "openssh-clients", "openssh-client"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "openssh, openssh-server, openssh-clients"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "openssh-server, openssh-client"

  - role: web-server
    names: ["nginx", "nginx-core", "httpd", "httpd-core", "mod_ssl", "apache2", "apache2-bin"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "nginx, httpd, mod_ssl"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "nginx, nginx-core, httpd, httpd-core, mod_ssl"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "nginx, apache2, apache2-bin（Ubuntu 16.04 では nginx-core もある）"

  - role: proxy
    names: ["haproxy", "stunnel", "stunnel4"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "haproxy（/usr/sbin/haproxy を含む）"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "haproxy（/usr/sbin/haproxy を含む）、stunnel4（/usr/bin/stunnel4 を含む）。RHEL 系のパッケージ名は stunnel"

  - role: mail-server
    names: ["postfix", "dovecot", "dovecot-core"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "postfix（/usr/sbin/postfix、/usr/libexec/postfix/smtpd を含む）"
      - image: "debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
        os: "Debian GNU/Linux 13 (trixie)"
        note: "postfix（/usr/sbin/postfix、/usr/lib/postfix/sbin/smtpd を含む）。dovecot-core（/usr/sbin/dovecot を含む）"
      - image: "almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2"
        os: "AlmaLinux 9.8 (Olive Jaguar)"
        note: "dovecot（/usr/sbin/dovecot を含む）。UBI のリポジトリにはないため、AlmaLinux の公式イメージで確認"

  - role: database
    # Debian 系は、版ごとのパッケージ名（postgresql-17 など）。postgresql-client-17 などは当てはまらない
    names: ["postgresql-server", "postgresql-9*", "postgresql-1*", "postgresql-2*", "mariadb-server", "mysql-server", "mysql8.4-server"]
    sources:
      - image: "almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2"
        os: "AlmaLinux 9.8 (Olive Jaguar)"
        note: "postgresql-server（/usr/bin/postgres を含む）。UBI のリポジトリにはないため、AlmaLinux の公式イメージで確認"
      - image: "debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
        os: "Debian GNU/Linux 13 (trixie)"
        note: "postgresql-17（/usr/lib/postgresql/17/bin/postgres を含む）。mariadb-server（/usr/sbin/mariadbd を含む）"
      - image: "almalinux@sha256:5a4b41a427c9717be8f4ac2a32aa22efbae5f9124fbcb79a6765394f312acfe8"
        os: "AlmaLinux 10.2 (Lavender Lion)"
        note: "mariadb-server（/usr/libexec/mariadbd）、mysql8.4-server（/usr/libexec/mysqld）。AlmaLinux 8 / 9 の MySQL は mysql-server"

  - role: java-runtime
    # Java の実行環境の本体（java.security を持つパッケージ）。-devel や GUI 用のパッケージは当てはまらない
    names:
      - java-1.8.0-openjdk-headless
      - java-11-openjdk-headless
      - java-17-openjdk-headless
      - java-21-openjdk-headless
      - java-25-openjdk-headless
      - openjdk-8-jre-headless
      - openjdk-11-jre-headless
      - openjdk-17-jre-headless
      - openjdk-21-jre-headless
      - openjdk-25-jre-headless
    sources:
      - image: "almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2"
        os: "AlmaLinux 9.8 (Olive Jaguar)"
        note: "java-1.8.0 / 11 / 17 / 21 / 25-openjdk-headless（/usr/lib/jvm/ の下に、実行環境の本体と java.security を持つ）"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "openjdk-8 / 11 / 17 / 21 / 25-jre-headless（/usr/lib/jvm/ の下に、実行環境の本体と java.security を持つ）"

  - role: crypto-policy
    names: ["crypto-policies", "crypto-policies-scripts"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "crypto-policies-20230731-1.git3177e06.el8"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "crypto-policies-20260714-1.git65b74f7.el9"

  - role: trust-store
    names: ["ca-certificates"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "ca-certificates"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "ca-certificates"
