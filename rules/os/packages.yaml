# 結果に記録するパッケージと、その役割。
# パッケージ管理データベース（rpm、dpkg）には数百〜数千のパッケージがあるため、
# 暗号ライブラリと、暗号の設定を持つソフトウェアだけを記録する（それ以外は件数だけ）。
#
# names は完全一致。末尾に * を付けると前方一致（共有ライブラリのパッケージ名は版を含むため。例: libssl3t64）。
# 各定義には出典（sources）が必須。パッケージ名は、下記イメージに該当ソフトウェアを導入して確認した。
packages:
  - role: crypto-library
    names: ["openssl", "openssl-libs", "libssl*", "gnutls", "libgnutls*", "libgcrypt", "libgcrypt*"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "openssl, openssl-libs, gnutls, libgcrypt"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "openssl, openssl-libs, gnutls, libgcrypt"
      - image: "ubuntu@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6"
        os: "Ubuntu 16.04.7 LTS"
        note: "openssl, libssl1.0.0, libgnutls30, libgcrypt20"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "openssl, libssl3t64, libgnutls30t64, libgcrypt20"

  - role: ssh
    names: ["openssh", "openssh-server", "openssh-clients", "openssh-client"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "openssh, openssh-server, openssh-clients"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "openssh-server, openssh-client"

  - role: web-server
    names: ["nginx", "nginx-core", "httpd", "httpd-core", "mod_ssl", "apache2", "apache2-bin"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "nginx, httpd, mod_ssl"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "nginx, nginx-core, httpd, httpd-core, mod_ssl"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "nginx, apache2, apache2-bin（Ubuntu 16.04 では nginx-core もある）"

  - role: proxy
    names: ["haproxy"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "haproxy（/usr/sbin/haproxy を含む）"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "haproxy（/usr/sbin/haproxy を含む）"

  - role: crypto-policy
    names: ["crypto-policies", "crypto-policies-scripts"]
    sources:
      - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
        os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
        note: "crypto-policies-20230731-1.git3177e06.el8"
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "crypto-policies-20260714-1.git65b74f7.el9"

  - role: trust-store
    names: ["ca-certificates"]
    sources:
      - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
        os: "Red Hat Enterprise Linux 9.9 (Plow)"
        note: "ca-certificates"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "ca-certificates"
