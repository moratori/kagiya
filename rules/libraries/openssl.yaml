# OpenSSL（libcrypto / libssl）。
# 版は、アプリのバイナリではなくライブラリ本体に埋め込まれた版文字列から読む。
# アプリ側にもビルド時の OpenSSL の版文字列が埋め込まれていることがあるが、実行時に使われる版とは限らない
# （RHEL 8.10 の nginx には "OpenSSL 1.1.1 FIPS  11 Sep 2018" が入っているが、実際にリンクされるのは 1.1.1k）。
# 版文字列があるのは libcrypto で、OpenSSL 3 系の libssl には入っていない。
library:
  id: openssl
  sonames: ["libcrypto.so*", "libssl.so*"]
  version_pattern: 'OpenSSL (\d+\.\d+\.\d+[a-z]{0,2})(?:-fips)? +(?:FIPS +)?\d{1,2} [A-Z][a-z]{2} \d{4}'
  packages: ["openssl-libs", "libssl*"]
  # システム全体の設定ファイル。RHEL 系は /etc/pki/tls/openssl.cnf、Debian / Ubuntu は /etc/ssl/openssl.cnf
  # （/usr/lib/ssl/openssl.cnf はそこへのシンボリックリンク）。`openssl version -a` の OPENSSLDIR で確認。
  config_files: ["/etc/pki/tls/openssl.cnf", "/etc/ssl/openssl.cnf"]
  # システム既定の TLS 設定として記録する項目。前半は RHEL 8.10 / 9.9 の暗号ポリシーが実際に出力していた項目、
  # 後半は OpenSSL の文書（SSL_CONF_cmd）にある同種の項目。ここにない項目は記録しない。
  system_default_keys:
    - CipherString
    - Ciphersuites
    - TLS.MinProtocol
    - TLS.MaxProtocol
    - DTLS.MinProtocol
    - DTLS.MaxProtocol
    - SignatureAlgorithms
    - Groups
    - MinProtocol
    - MaxProtocol
    - Curves
    - ClientSignatureAlgorithms
    - Protocol
    - Options
  sources:
    - image: "redhat/ubi8@sha256:44f19e308462e9152cb26d641fc0ce5bf6cbdab3cd101367aed67573eb2cf20e"
      os: "Red Hat Enterprise Linux 8.10 (Ootpa)"
      note: "/usr/lib64/libcrypto.so.1.1.1k に 'OpenSSL 1.1.1k  FIPS 25 Mar 2021'。パッケージは openssl-libs"
    - image: "redhat/ubi9@sha256:8b212f75a0e5a156ac28b1c5c030d2e8a07715254e19d522286118279399af81"
      os: "Red Hat Enterprise Linux 9.9 (Plow)"
      note: "/usr/lib64/libcrypto.so.3.5.9 に 'OpenSSL 3.5.9 29 Sep 2026'。libssl.so.3.5.9 には版文字列なし"
    - image: "ubuntu@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6"
      os: "Ubuntu 16.04.7 LTS"
      note: "/lib/<arch>-linux-gnu/libcrypto.so.1.0.0 に 'OpenSSL 1.0.2g  1 Mar 2016'。パッケージは libssl1.0.0"
    - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
      os: "Ubuntu 24.04.5 LTS"
      note: "/usr/lib/<arch>-linux-gnu/libcrypto.so.3 に 'OpenSSL 3.0.13 30 Jan 2024'。パッケージは libssl3t64"
  # 耐量子のアルゴリズムに対応している版（「対応」は、ライブラリがその方式を持っていること。TLS で使う設定になっているかは、実効値で見る）。
  # 「3.5.0 から」は開発元の資料による。実物では、3.0.13 と 3.4.1 にないこと、3.5.7 と 3.5.8 にあることを確かめた。
  pqc:
    features:
      - { name: ML-KEM, since: "3.5.0", checked: { from: "3.0.13", to: "3.5.8" }, evidence: documented }
      - { name: ML-DSA, since: "3.5.0", checked: { from: "3.0.13", to: "3.5.8" }, evidence: documented }
      - { name: SLH-DSA, since: "3.5.0", checked: { from: "3.0.13", to: "3.5.8" }, evidence: documented }
      - { name: TLS-MLKEM, since: "3.5.0", checked: { from: "3.0.13", to: "3.5.8" }, evidence: documented }
      - { name: TLS-MLKEM-hybrid, since: "3.5.0", checked: { from: "3.0.13", to: "3.5.8" }, evidence: documented }
    sources:
      - image: "debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
        os: "Debian GNU/Linux 13 (trixie)"
        note: "2026-11-14、openssl 3.5.7-1~deb13u3 の openssl list（-kem-algorithms、-signature-algorithms、-tls-groups）に、ML-KEM-512/768/1024、ML-DSA-44/65/87、SLH-DSA の各種、TLS のグループ MLKEM512/768/1024・X25519MLKEM768・SecP256r1MLKEM768・SecP384r1MLKEM1024 がある"
      - image: "almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2"
        os: "AlmaLinux 9.8 (Olive Jaguar)"
        note: "2026-11-14、openssl 3.5.8-2.el9_8 でも同じ（既定のプロバイダに、上と同じアルゴリズムとグループがある）"
      - image: "ubuntu@sha256:27771fb7b40a58237c98e8d3e6b9ecdd9289cec69a857fccfb85ff36294dac20"
        os: "Ubuntu 25.04"
        note: "2026-11-14、openssl 3.4.1-1ubuntu4 の同じ一覧には、ML-KEM、ML-DSA、SLH-DSA も、ML-KEM を含む TLS のグループもない"
      - image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
        os: "Ubuntu 24.04.5 LTS"
        note: "2026-11-14、openssl 3.0.13-0ubuntu3.16 の同じ一覧にも、ない。開発元の資料（NEWS.md、OpenSSL 3.5.0 [8 Apr 2025]）: 「Support for PQC algorithms (ML-KEM, ML-DSA and SLH-DSA)」「The default TLS keyshares have been changed to offer X25519MLKEM768 and X25519」 https://github.com/openssl/openssl/blob/openssl-3.5/NEWS.md"
