# Tomcat の TLS の対応表。server.xml の暗号指定（ciphers。OpenSSL の書き方）と protocols を、スイートとプロトコルの一覧に直すのに使う。
#
# Tomcat は、OpenSSL の書き方の暗号指定を、自分の持つ表で解釈する（OpenSSL には渡さない。JDK の実装で動く場合）。
# どの語がどのスイートを指すか、既定の暗号指定、Tomcat Native に求める版は、Tomcat の版ごとに違うので、版ごとに実物で採取した値を持つ。
#
# 採取方法: 各イメージにディストリのリポジトリから Tomcat を導入し、Tomcat 自身のクラスに出力させた（サーバーは起動しない）。
#   default_ciphers        : ciphers を書かないときの暗号指定（SSLHostConfig の既定値）。
#   protocols_all          : protocols の「all」が指すプロトコル。protocols を書かないときの既定でもある。
#   ciphersuites_attribute : TLS 1.3 のスイートを別の属性（ciphersuites）で指定する版かどうか。
#                            true の版では、ciphers に何を書いても TLS 1.3 のスイートは変わらない（実際に起動して確かめた）。
#   default_ciphersuites   : ciphersuites を書かないときの TLS 1.3 のスイート。
#   strength_ends          : 暗号指定の @STRENGTH の後ろに書かれた要素を読まない版かどうか（版によって違う）。
#   native_required        : Tomcat Native（OpenSSL の実装で動かすためのライブラリ）に求める最小の版。系列（1.x / 2.x）ごと。
#                            これより古いものは読み込まれず、JDK の実装で動く。
#   suites                 : Tomcat が持つスイートの表。jsse は Java での名前、words はそのスイートだけを指す語（OpenSSL での名前など）。
#   classes                : 複数のスイートを指す語（HIGH、kRSA など）と、指すスイート（suites の中の位置。0 始まり）。
#
# 式の解釈（区切り、!、-、+、@STRENGTH）は本体のコード（internal/tomcatciphers）にあり、
# Tomcat 自身の解釈結果と、版ごとに約 5,200 の式で突き合わせて確かめている（集合として一致。並び順は再現しない）。
#
# このファイルは検証ラボの生成スクリプトで作った。手で編集しない。
tomcat_tables:
  - server: tomcat
    upstream: "9.0.31"
    builds:
      - package: tomcat9
        version: "9.0.31-1ubuntu0.9"
        source:
          image: "ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"
          os: "Ubuntu 20.04.6 LTS"
          note: "package installed from the distribution repository in the image; defaults, the cipher table and the meaning of each word reported by Tomcat's own classes (SSLHostConfig, OpenSSLCipherConfigurationParser) without starting the server"
    default_ciphers: "HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!kRSA"
    protocols_all: [SSLv2Hello, TLSv1, TLSv1.1, TLSv1.2, TLSv1.3]
    ciphersuites_attribute: false
    strength_ends: true
    native_required: ["1.2.14"]
    suites:
