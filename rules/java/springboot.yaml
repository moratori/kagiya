# Spring Boot（組み込みの Tomcat で TLS を待ち受けるアプリ）の、版ごとの設定の効き方。
# 受け入れるプロトコルと暗号スイートは、JAR の中の設定（server.ssl.*）と、同梱の Tomcat の表（tomcat-embedded.yaml）、
# アプリを動かす JDK の表（openjdk.yaml）から求める。ここには、Spring Boot の版によって違うことだけを持つ。
#
#   ssl_bundles    : SSL バンドル（server.ssl.bundle と spring.ssl.bundle.*）の設定が効くか。
#                    yes = 効く / no = その版にはこの設定がなく、書いても TLS を待ち受けない / unknown = 測った設定では起動しなかった
#   pem_properties : 証明書と鍵を PEM のファイルで指定する設定（server.ssl.certificate、server.ssl.certificate-private-key）が効くか。値は同じ
#
# どの版にも共通で確かめたこと（測った全場面で、参照モデルと実測が一致）:
#   - server.ssl.enabled-protocols と server.ssl.ciphers が効く。server.ssl.protocol は、受け入れるプロトコルの絞り込みには効かない
#   - server.ssl.ciphers を書くと、TLS 1.3 のスイートもその指定に従う（パッケージの Tomcat の server.xml とは違う）
#   - 同じ場所では application.properties が application.yml に勝つ。有効にしたプロファイルの設定が上書きし、有効でないプロファイルの設定は効かない
#   - server.ssl.enabled=false、またはキーストアや証明書の指定がなければ、TLS を待ち受けない
#
# 採取方法: Docker 公式の maven イメージで、各版の最小のアプリ（spring-boot-starter-web）を Maven Central の成果物からビルドし、
#           Ubuntu 24.04 の OpenJDK 21 で実際に起動して、JAR の中の設定を変えた場面ごとに、同じコンテナ内からのハンドシェイク
#           （スイートを 1 つずつ示す）で受け入れるスイートを数え上げた。
#
# このファイルは検証ラボの生成スクリプト（lab/phase2/gen-springboot.py）で作った。手で編集しない。
