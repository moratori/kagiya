      os: "Ubuntu 24.04.5 LTS"
      note: "tomcat-embed-core JARs taken from Spring Boot applications built from Maven Central artifacts in the image; defaults, the cipher table and the meaning of each word reported by Tomcat's own classes without starting the server"
