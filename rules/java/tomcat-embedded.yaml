# アプリに同梱される Tomcat（tomcat-embed-core。Spring Boot などの実行できる JAR の中に入っている）の TLS の対応表。
# 中身の形と意味は、パッケージの Tomcat の表（tomcat.yaml）と同じ。サーバーを起動して確かめる項目は持たない
# （同梱の Tomcat への設定の渡り方は、アプリの枠組みごとに違う。Spring Boot の分は springboot.yaml）。
#
# 中身が同じだった版は 1 つの表にまとめている。引くのは、版が完全に一致するものだけ（補間しない）。
#
# 採取方法: Docker 公式の maven イメージで、Spring Boot の各版の最小のアプリを Maven Central の成果物からビルドし、その JAR に同梱されていた
#           tomcat-embed-core の JAR のクラスに出力させた（サーバーは起動しない）。versions の sha256 は、その JAR のチェックサム。
#           式の解釈は、Tomcat 自身の解釈結果と、版ごとに約 5,400 の式で突き合わせて確かめている（集合として一致）。
#
# このファイルは検証ラボの生成スクリプト（lab/phase2/gen-springboot.py）で作った。手で編集しない。
