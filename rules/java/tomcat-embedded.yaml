      - {version: "11.0.18", sha256: "b9bd0dd346fdade192cb7868418efa7aa20b12f1fddd5ab28cdef183ac6b5743"}
    source:
      image: "maven@sha256:851ccd76d49d5646915645e5fb51e9b00ef53ad3dc68b0e9a2a9846b9c56bde3"
      os: "Ubuntu 24.04.5 LTS"
      note: "tomcat-embed-core JARs taken from Spring Boot applications built from Maven Central artifacts in the image; defaults, the cipher table and the meaning of each word reported by Tomcat's own classes without starting the server"
    default_ciphers: "HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!kRSA"
    protocols_all: [SSLv2Hello, TLSv1, TLSv1.1, TLSv1.2, TLSv1.3]
    ciphersuites_attribute: true
    default_ciphersuites: [TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256, TLS_AES_128_GCM_SHA256]
    strength_ends: true
    native_required: ["1.3.4", "2.0.12"]
