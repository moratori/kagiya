#     temurin21（eclipse-temurin@sha256:0a3f329821dcadf54b2a3033a15e2e9f007069a9db43d7f51897e6b80e726b07、21.0.13+9-LTS）= alma10、alma8、alma9、debian13 の Java 21.0.13
#     temurin25（eclipse-temurin@sha256:b8705e936964c228dfce359e63dbf08f6c69cb380ed1d576b1f6b1064f15567d、25.0.5+8-LTS）= alma10、alma9、debian13 の Java 25.0.5
#     temurin8（eclipse-temurin@sha256:c424f46b825d495a28e8f26ca5f411585119e5d9bd9152521180b9d5e5a303c4、1.8.0_512-b09）= alma8、ubuntu2204、ubuntu2404 の Java 1.8.0_512
