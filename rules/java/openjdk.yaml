# OpenJDK の TLS（JSSE）の対応表。Java のサーバーが受け入れるプロトコル、暗号スイート、鍵交換のグループを、
# Java を動かさずに求めるのに使う。
#
# Java の TLS は OpenSSL を使わず、JDK 自身の実装で決まる。JDK が対応しているものから、セキュリティの設定
# （java.security の jdk.tls.disabledAlgorithms。RHEL 系では暗号ポリシーの java.config が置き換える）で無効にされたものを除いたものが、
# 既定で受け入れるものになる。対応しているものと解釈のしかたは、ディストリのパッケージ版ごとに違うので、版ごとに実物で採取した値を持つ。
#   wildcard               : 無効にする方式に書いた「TLS_RSA_*」のような名前のパターンを解釈するか（解釈しない版では、その項目は何も無効にしない）。
#   disable_groups_by_name : 無効にする方式に書いたグループの名前（x25519 など）が効くか（効かない版でも、鍵長の条件は効く）。
#   dhe_default_bits       : TLS 1.2 以下の DHE で、クライアントが ffdhe のグループを示さないときに使う DH パラメータの長さ。
#   system_properties_file : java.security の security.useSystemPropertiesFile=true で、暗号ポリシーのファイル
#                            （/etc/crypto-policies/back-ends/java.config）の値が上書きする版（RHEL 系の 8 / 11 / 17 / 21）。
#   security_include       : java.security の include での取り込みを実測で確かめた版（RHEL 系の 25。暗号ポリシーのファイルを取り込む）。
#   unusable_groups        : jdk.tls.namedGroups で名前を挙げても受け入れなかったグループ（Java での名前。測った範囲で）。
#   protocols              : 対応しているプロトコル。default は、制限をすべて外したときにサーバーで有効なもの。
#   suites                 : 対応している暗号スイート（JDK が答える並び）。default は、制限をすべて外したときにサーバーで有効なもの。
#   groups                 : 制限をすべて外したときに受け入れる鍵交換のグループ。name は本体での正式な名前、jsse は Java での名前、id は TLS での番号。
#                            並びは、JDK 自身が答える版（20 以降）ではその並び、答えない版では番号の順（優先順ではない）。
#     key                  : 鍵長の条件（「EC keySize < 384」など）に当てはめるときの種類と長さ。ないものは、鍵長の条件に当たらなかったもの。
#
# 採取方法: 各イメージにディストリのリポジトリから OpenJDK を導入し、無効にする方式をすべて空にした状態で、JDK 自身に報告させた。
#           グループは、同じコンテナ内で Java の TLS サーバーを起動し、グループを 1 つだけ示した ClientHello を送って確かめた
#           （試す側の OpenSSL の版に左右されないよう、ClientHello は直接組み立てている）。
#           無効にする方式の解釈は、場面を変えて採取した結果（プロトコル、スイート、グループ）をすべて再現することを確かめている。
#           RHEL 系は AlmaLinux の公式イメージで測った（出典に記録）。
#
#   java_version           : 開発元の版（JDK のディレクトリにある release ファイルの JAVA_VERSION と同じ値）。
#
# 配布元をまたぐ補間: 表にないパッケージや配布元の JDK は、release ファイルの JAVA_VERSION が表の java_version と一致する場合に限り、
#   その表で補う（確度を下げ、注記を付ける。暗号ポリシーとのつなぎ方は引き継がない）。これは JDK の表だけの扱いで、根拠は次の検証。
#   配布元の公式イメージの JDK を同じ方法で測り、開発元の版が同じディストリの表と、中身がすべて同じであることを確かめた:
#     corretto17（amazoncorretto@sha256:b505ecf1fd737d85c0fd3930b8ab3ed0cb560326809aacc838b3938a9bc84c4b、17.0.21+11-LTS）= alma8、alma9 の Java 17.0.21
#     corretto21（amazoncorretto@sha256:90100f194336ef2326f5efe1ee747395fd87d8210ad6d60463196aa0c4b0ad4e、21.0.13+11-LTS）= alma10、alma8、alma9、debian13 の Java 21.0.13
#     corretto8（amazoncorretto@sha256:7ce090784b223ea0ecff941e40c63f48b9df25156778c56a3b259de1c85bccd0、1.8.0_512-b09）= alma8、ubuntu2204、ubuntu2404 の Java 1.8.0_512
#     temurin11（eclipse-temurin@sha256:8b64035b610d11979ee0fdefca06355b8fcfb7001ec657a5223ca996b82614b4、11.0.33+10）= ubuntu2204、ubuntu2404 の Java 11.0.33
