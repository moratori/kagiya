# WildFly の TLS の対応表。standalone.xml の暗号の指定（Elytron の server-ssl-context の cipher-suite-filter。OpenSSL に似た書き方）を、
# スイートの一覧に直すのに使う。
#
# WildFly（Elytron）は、暗号の指定を、自分の持つ表で解釈する（OpenSSL には渡さない。JDK の実装で動く場合）。
# 解釈の結果は、JDK が対応しているスイートの並びから選ばれる。実際に受け入れるのは、そのうち JDK が無効にしていないもの。
#
# 採取方法: 開発元の配布物（Maven Central の org.wildfly:wildfly-dist の zip）を展開し、Elytron の JAR の中の表
#           （org/wildfly/security/ssl/MechanismDatabase.properties）を取り出した。あわせて、設定を変えた場面ごとにサーバーを起動し、
#           同じコンテナ内からのハンドシェイクで、受け入れるものを数え上げた。
#           表は、測った 54 版すべてで同一（SHA-256: 105ab8b96d86feb1d11da4006ef318e37205ddf748f71e60ac6971adee0244dc）。
#           測定結果は、古い形式の設定（security-realm）を持つ版（19〜24）どうし、持たない版（25 以降）どうしで、全場面が同一。
# 表のもとになったファイルは、WildFly Elytron（Apache License 2.0）の一部。ここには、スイートごとの属性（事実）だけを写している。
# このファイルは検証ラボの生成スクリプト（lab/phase2/gen-wildfly.py）で作った。手で編集しない。
wildfly_tables:
  - source:
      image: "ubuntu@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5"
      os: "Ubuntu 24.04.5 LTS"
      note: "official distribution archives (org.wildfly:wildfly-dist on Maven Central) unpacked in the container; the cipher table taken from the Elytron JAR; each server started with OpenJDK (11.0.33, 17.0.21.0.3) and the accepted protocols, suites and groups enumerated by handshake"
    elytron_table_sha256: "105ab8b96d86feb1d11da4006ef318e37205ddf748f71e60ac6971adee0244dc"
    # 暗号の指定を書かない場合の指定と、プロトコルの既定（起動したサーバー自身に、管理用コマンドで尋ねた）。
    # TLS 1.3 は、TLS 1.3 用の指定（cipher-suite-names）を書いたときだけ受け入れる（実測）
    default_cipher_suite_filter: "DEFAULT"
    default_protocols: ["TLSv1", "TLSv1.1", "TLSv1.2"]
    tls13_requires_cipher_suite_names: true
    legacy_default_protocols: ["TLSv1", "TLSv1.1", "TLSv1.2"]
