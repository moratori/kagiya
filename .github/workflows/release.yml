name: Release

# タグ（v で始まる版番号）を push すると、実行ファイルをビルドして GitHub のリリースに添付する。
# 例: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v[0-9]*"

# 既定は読み取りだけ。リリースを作るジョブにだけ書き込みを与える。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 依存は vendor/ に固定してあり、ビルド・テスト中にモジュールを取得しない。
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: タグの形を確認
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 または v1.2.3-rc.1 の形だけを受け付ける（ファイル名と版の文字列に使うため）
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "unexpected tag: $TAG"; exit 1; }
      - name: go vet / go test
        run: |
          go vet ./...
          go test ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # scan が動くのは Linux だけなので、Linux の x86_64 と aarch64 を配布する。
          # アセット名は kagiya_linux_<アーキテクチャ>_<タグ>。アーキテクチャは、配布先のホストで uname -m が返す名前
          # （RPM のアーキテクチャ名と同じ x86_64 / aarch64）にする。
          mkdir -p "$RUNNER_TEMP/release"
          for pair in amd64:x86_64 arm64:aarch64; do
            goarch=${pair%%:*}; arch=${pair##*:}
            out="$RUNNER_TEMP/release/kagiya_linux_${arch}_${TAG}"
            GOOS=linux GOARCH=$goarch go vet ./...
            GOOS=linux GOARCH=$goarch go build -trimpath -buildvcs=false \
              -ldflags "-X kagiya/internal/cli.Version=${TAG#v}" -o "$out" ./cmd/kagiya
            # 通信・プロセス起動系のシンボルがないこと（CI と同じ確認を、配布する実体に対して行う）
            n=$(go tool nm "$out" | grep -cE ' net\.| net/http|os/exec\.|syscall\.(socket|connect|bind|listen|accept|sendto)$' || true)
            echo "$arch: matching symbols: $n"; test "$n" = 0
          done
      - name: 版が埋め込まれていること
        env:
          TAG: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/release/kagiya_linux_x86_64_${TAG}" version | tee "$RUNNER_TEMP/version.txt"
          grep -q "^kagiya ${TAG#v} " "$RUNNER_TEMP/version.txt"
      - name: チェックサム
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum kagiya_linux_* > "SHA256SUMS_${TAG}.txt"
          cat "SHA256SUMS_${TAG}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # リリースの作成とアセットの添付
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: リリースを作成
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # アーティファクトを経由すると実行権限が落ちるので、利用者は chmod +x してから使う（README に記載）。
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes $prerelease
